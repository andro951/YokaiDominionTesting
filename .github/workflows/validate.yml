name: Validate pinned production revision
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable production pin
        id: pin
        shell: bash
        run: |
          ref="$(tr -d '\r\n' < production.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo 'production.ref must contain a full commit SHA'; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing YokaiDominion commit $ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          repository: andro951/YokaiDominion
          ref: ${{ steps.pin.outputs.sha }}
          path: production
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run production numerical checks
        working-directory: production
        env:
          YOKAI_SOURCE_REVISION: ${{ steps.pin.outputs.sha }}
        run: dotnet run --project tests/Yokai.Tissue.Checks -c Release
      - name: Run rotation and volume regression checks
        working-directory: production
        env:
          YOKAI_SOURCE_REVISION: ${{ steps.pin.outputs.sha }}
        run: dotnet run --project tests/Yokai.Tissue.AdvancedChecks -c Release
      - name: Characterize volume response with one changed parameter
        run: dotnet run --project scenarios/MaterialSweep -c Release
      - name: Archive exact source pair
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/testing-source.zip HEAD
          git -C production archive --format=zip --output="$GITHUB_WORKSPACE/artifacts/production-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-validation
          path: |
            artifacts/
            production/artifacts/*-results.json
          if-no-files-found: warn
          retention-days: 14
